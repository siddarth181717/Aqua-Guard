version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: aquaguard_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: aquaguard_db
      POSTGRES_USER: aquaguard_prod_user
      POSTGRES_PASSWORD: aquaguard_prod_secure_password_2026
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquaguard_prod_user -d aquaguard_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: aquaguard_prod_backend
    restart: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://aquaguard_prod_user:aquaguard_prod_secure_password_2026@postgres:5432/aquaguard_db
      ML_MODEL_PATH: models/restoration_priority_model.pkl
      DATA_DIRECTORY: data
      CORS_ORIGINS: '["https://aquaguard.gov.in","https://app.aquaguard.gov.in"]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aquaguard_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: https://api.aquaguard.gov.in/api/v1
      VITE_API_BASE_URL: https://api.aquaguard.gov.in/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: aquaguard_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  prod_postgres_data:
    driver: local
